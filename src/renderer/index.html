<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Norcini Workbench</title>
  <link rel="stylesheet" href="../../node_modules/xterm/css/xterm.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <div class="app-mark">NW</div>
      <div class="brand">Norcini Workbench <span class="version">0.8.1</span></div>
    </div>
    <div class="nav-actions">
      <button id="backBtn" class="icon-btn" title="Back" disabled>‹</button>
      <button id="forwardBtn" class="icon-btn" title="Forward" disabled>›</button>
      <button id="homeBtn">Home</button>
    </div>
    <div id="activePath" class="active-path">org:/home.org</div>
    <div class="top-actions">
      <button id="newNoteBtn">+ New note</button>
      <button id="toggleEditorBtn">Quick edit</button>
      <button id="terminalHereBtn">Terminal here</button>
    </div>
  </header>

  <main id="workspace" class="workspace editor-hidden">
    <aside id="filesPane" class="panel files-pane">
      <div class="panel-header">
        <span>Files</span>
        <div class="header-actions">
          <button id="newFolderBtn" title="New folder">+</button>
          <button id="refreshFilesBtn" title="Refresh">↻</button>
        </div>
      </div>
      <div class="root-tabs">
        <button data-root="org:/" class="root-tab active">Org</button>
        <button data-root="hopkins:/" class="root-tab">Hopkins</button>
        <button data-root="documents:/" class="root-tab">Documents</button>
        <button data-root="desktop_inbox:/" class="root-tab">Inbox</button>
      </div>
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div id="fileTree" class="file-tree"></div>
    </aside>

    <div id="filesResize" class="resize-v"></div>

    <section id="editorPane" class="panel editor-pane">
      <div class="panel-header">
        <span id="editorTitle">Quick edit</span>
        <div class="header-actions">
          <span id="dirtyDot" class="dirty-dot" hidden>●</span>
          <button id="saveBtn">Save</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>

    <div id="editorResize" class="resize-v editor-resize"></div>

    <section id="previewPane" class="panel preview-pane">
      <div class="panel-header">
        <span>Rendered view</span>
        <div id="contextActions" class="header-actions">
          <button id="runBtn" hidden>Run</button>
          <button id="buildBtn" hidden>Build PDF</button>
          <button id="runNotebookBtn" hidden>Run notebook</button>
          <button id="openDefaultBtn">Open in macOS</button>
          <button id="refreshPreviewBtn">Refresh</button>
        </div>
      </div>
      <iframe id="preview" title="Rendered view"></iframe>
    </section>

    <div id="terminalResize" class="resize-h"></div>

    <section id="terminalPane" class="panel terminal-pane">
      <div class="panel-header terminal-header">
        <span>Terminal <span class="muted">Bash</span> <span id="terminalStatus" class="terminal-status">starting…</span></span>
        <div class="header-actions">
          <button id="terminalRestartBtn">Restart</button>
        </div>
      </div>
      <div id="terminal"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <dialog id="newNoteDialog">
    <form id="newNoteForm">
      <h2>New note</h2>
      <label>Category
        <select id="noteCategory">
          <option>meetings</option><option>lab_notebook</option><option>logs</option>
          <option selected>reference</option><option>teaching</option><option>personal</option>
          <option>household</option><option>archive</option>
        </select>
      </label>
      <label>Title <input id="noteTitle" required></label>
      <label class="checkline"><input id="noteDated" type="checkbox" checked><span>Dated note</span></label>
      <label>Date <input id="noteDate" type="date"></label>
      <div class="dialog-actions"><button type="button" id="cancelNoteBtn">Cancel</button><button type="submit" class="primary">Create</button></div>
    </form>
  </dialog>

  <dialog id="contextMenu" class="context-dialog">
    <div class="context-list">
      <button id="ctxRename">Rename</button>
      <button id="ctxMove">Move</button>
      <button id="ctxReveal">Reveal in Finder</button>
      <button id="ctxTrash" class="danger">Move to Trash</button>
    </div>
  </dialog>

  <script src="../../node_modules/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="./app.js"></script>
</body>
</html>
